[package]
name = "jarscope"
version = "0.3.3"
edition = "2024"
description = "Fast JAR inspector CLI in Rust: Java version, contents, manifest and class search, no JVM needed."
license = "MIT"
repository = "https://github.com/elmir39/jarscope"
rust-version = "1.88"
readme = "README.md"
keywords = ["java", "jar", "classfile", "bytecode", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rayon = "1.12.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
