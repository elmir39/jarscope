[package]
name = "jarscope"
version = "0.1.0"
edition = "2024"
description = "Fast JAR inspector CLI in Rust: Java version, contents, manifest and class search, no JVM needed."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
